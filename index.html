<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#2a1b7a"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="description" content="Pick a stage, cut the rope and fly your balloon through the sky, a jungle island, a crystal cave, a robot factory, outer space and the deep universe."><title>Skybound — Balloon Arcade</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap"><link rel="stylesheet" href="style.css"></head><body>
<section class="game-shell in-menu" aria-label="Skybound balloon arcade"><canvas id="game" aria-label="Swipe across the rope to release the balloon, then drag to steer around obstacles." tabindex="0"></canvas>
<div class="play-col">
 <div class="hud">
  <div class="hud-left"><div class="hud-alt panel"><small>ALTITUDE</small><strong><span id="altitude">0</span><span class="unit">m</span></strong></div><div class="zone"><span class="ico" id="zone-icon"></span><span id="zone">SUNNY SKY</span></div><div class="flight-info"><span id="weather" role="status">CALM AIR</span><span id="speed">0 m/s</span></div></div>
  <div class="hud-right"><div class="hud-row"><div id="coin-pill" class="coin-pill panel"><span class="coin-icon" data-icon="coin"></span><b id="coin-count">0</b></div><button id="pause" class="icon-btn" aria-label="Pause game" data-icon="pause"></button></div>
   <div class="chips"><div class="chip" id="chip-boost" hidden><span class="ico" id="chip-boost-icon" data-icon="flame"></span><i><b></b></i></div><div class="chip" id="chip-shield" hidden style="--c:#44d9ff"><span class="ico" data-icon="shield"></span><i><b></b></i></div><div class="chip" id="chip-magnet" hidden style="--c:#ff4d5e"><span class="ico" data-icon="magnet"></span><i><b></b></i></div></div></div>
 </div>
 <div id="hint" class="hint" hidden><div class="hint-stage"><span class="ico" id="hint-icon"></span><span id="hint-stage">SUNNY SKY</span></div><div class="best-chip" id="best">NO RECORD YET</div><strong>SWIPE THE ROPE!</strong><div class="hand" data-icon="scissors" aria-hidden="true"></div><span>Grab coins · Fill energy · Fire the BOOST</span></div>
 <button id="boost" class="boost-btn" hidden disabled aria-label="Fire boost engine"><span class="bolt" data-icon="bolt"></span><span class="label">BOOST</span><span class="pips"><i></i><i></i><i></i><i></i><i></i></span></button>
 <div id="announce" class="announce-layer" aria-live="polite"></div>
</div>
<div id="menu" class="menu">
 <div class="menu-top"><div class="wallet-row"><div class="pill"><span class="ico" data-icon="coin"></span><b id="menu-coins">0</b></div><div class="pill"><span class="ico" data-icon="heart"></span><b id="menu-lives">1</b></div></div><div class="tools"><button class="icon-btn sound-toggle" aria-label="Enable sound"></button><button class="icon-btn fs-toggle" aria-label="Toggle full screen" data-icon="fullscreen"></button></div></div>
 <div class="logo">SKY<span>BOUND</span></div>
 <div class="picker"><button class="arrow" id="prev-stage" aria-label="Previous stage" data-icon="left"></button><div class="stage-show" id="stage-show"><div class="stage-icon" id="stage-icon"></div><div class="stage-name" id="stage-name">SUNNY SKY</div><div class="stage-sub"><span id="stage-best">NOT PLAYED YET</span><span class="medal-row" id="stage-medals"></span></div></div><button class="arrow" id="next-stage" aria-label="Next stage" data-icon="right"></button></div>
 <div class="dots" id="stage-dots"></div>
 <div class="menu-actions"><button id="open-store" class="side-btn green"><span class="ico" data-icon="bag"></span><small>STORE</small></button><button id="play" class="btn huge"><span class="ico" data-icon="play"></span>PLAY</button><button id="open-boosts" class="side-btn purple"><span class="ico" data-icon="bolt"></span><small>BOOSTS</small></button></div>
 <div class="cut-hint"><span class="ico" data-icon="scissors"></span>or swipe the rope to launch</div>
</div>
<div id="overlay" class="overlay" hidden><div class="card"><div class="card-tools tools"><button class="icon-btn small sound-toggle" aria-label="Enable sound"></button><button class="icon-btn small fs-toggle" aria-label="Toggle full screen" data-icon="fullscreen"></button></div><div class="ribbon" id="result-label">PAUSED</div><div id="record" class="record-badge" hidden>NEW<br>BEST!</div><h2 id="result-title">Paused</h2><div id="result-medals" class="medal-row big"></div><p id="result-text">The sky can wait a moment.</p><div id="stats" class="stats" hidden><div><small>ALTITUDE</small><b id="stat-alt">0 m</b></div><div><small>COINS</small><b id="stat-coins">0</b></div><div><small>BEST</small><b id="stat-best">0 m</b></div></div><button id="revive" class="btn green revive" hidden>REVIVE</button><div class="card-buttons"><button id="primary" class="btn">RESUME</button><button id="secondary" class="btn blue">MENU</button></div></div></div>
<div id="panel" class="overlay" hidden><div class="card wide"><div class="ribbon" id="panel-title">STORE</div><div id="panel-list" class="panel-list"></div><div class="card-buttons"><button id="panel-close" class="btn"><span class="ico" data-icon="left"></span>BACK</button></div></div></div>
</section><script src="sound.js"></script><script src="icons.js"></script><script src="stages.js"></script><script src="skins.js"></script><script src="game.js"></script></body></html>
